# Production Docker Compose Configuration
# Uses immutable images with code baked in
name: kubephp

secrets:
  # Override with COMPOSER_AUTH_FILE=/path/to/auth.json for private Composer repos.
  composer_auth:
    file: ${COMPOSER_AUTH_FILE:-./docker/composer-auth.default.json}

services:
  app:
    build:
      context: .
      target: app
      args:
        APP_BASE_DIR: ${APP_BASE_DIR-.}
        OS_PACKAGE_UPGRADE_TRIGGER: ${OS_PACKAGE_UPGRADE_TRIGGER-2}
      secrets:
        - composer_auth
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        APP_BASE_DIR: ${APP_BASE_DIR-.}
        OS_PACKAGE_UPGRADE_TRIGGER: ${OS_PACKAGE_UPGRADE_TRIGGER-2}
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The Hostname for the FPM (needs to match the hostname for the `app`)
      PHP_FPM_HOST: app
    ports:
      # Bound to loopback by default; front it with a reverse proxy / ingress to expose externally.
      - '127.0.0.1:8080:8080'
    restart: unless-stopped
